<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXORA — Streaming</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="logo">NEX<span>O</span>RA</div>
  <nav id="nav">
    <button class="nav active" data-filter="all">Accueil</button>
    <button class="nav" data-filter="film">Films</button>
    <button class="nav" data-filter="serie">Séries</button>
    <button class="nav" data-filter="anime">Animés</button>
    <button class="nav" data-filter="new">Nouveautés</button>
    <button class="nav" data-filter="trend">Tendances</button>
    <button class="nav" data-filter="mylist">Ma liste</button>
  </nav>
  <div class="actions">
    <input id="search" placeholder="Rechercher…" autocomplete="off">
    <button class="avatar">S</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-content">
      <span class="badge">NEXORA</span>
      <p class="eyebrow">VOTRE PLATEFORME DE STREAMING</p>
      <h1 id="heroTitle">PREMIER<br>CONTACT</h1>
      <p class="meta" id="heroMeta">Film · Science-fiction · 2026 · 8.7/10</p>
      <p class="description" id="heroDesc">Votre catalogue NEXORA se charge maintenant directement depuis votre base de données.</p>
      <div class="hero-buttons">
        <button class="primary" id="heroWatch">▶ Regarder</button>
        <button class="secondary" id="heroList">＋ Ma liste</button>
      </div>
    </div>
  </section>

  <div id="status" class="status">Connexion à NEXORA…</div>
  <div id="content"></div>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="close" id="closeModal">×</button>
    <div id="modalPoster" class="modal-poster"></div>
    <div class="modal-info">
      <p class="eyebrow" id="modalType"></p>
      <h2 id="modalTitle"></h2>
      <p id="modalMeta"></p>
      <p id="modalDesc"></p>
      <button class="primary" id="modalWatch">▶ Regarder</button>
      <button class="secondary" id="modalList">＋ Ma liste</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
